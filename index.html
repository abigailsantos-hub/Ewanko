<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💌 Para Sa'yo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Great+Vibes&family=Quicksand:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: radial-gradient(circle at 20% 20%, #fbf3ec 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, #f3e4d8 0%, transparent 50%),
                linear-gradient(145deg, #f6efe9 0%, #e8d9d0 100%);
    font-family: 'Quicksand', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
    position: relative;
    overflow-x: hidden;
  }

  /* ====== SCREENS ====== */
  .screen {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    transition: opacity 0.8s ease, visibility 0.8s ease;
    z-index: 50;
  }

  .screen.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  /* ====== PIN SCREEN ====== */
  #pinScreen {
    background: linear-gradient(145deg, #f6efe9 0%, #e8d9d0 100%);
    z-index: 60;
  }

  .pin-card {
    background: #fffcf7;
    border-radius: 28px;
    padding: 3rem 2.5rem;
    max-width: 400px;
    width: 100%;
    text-align: center;
    box-shadow: 0 25px 50px -15px rgba(70, 45, 30, 0.28);
    border: 1px solid rgba(230, 210, 190, 0.55);
  }

  .pin-icon { font-size: 3rem; margin-bottom: 1rem; }

  .pin-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.2rem;
    font-weight: 500;
    letter-spacing: 1px;
    color: #5e4b3c;
    margin-bottom: 1.8rem;
  }

  .pin-input {
    font-family: 'Quicksand', sans-serif;
    font-size: 1.6rem;
    letter-spacing: 8px;
    text-align: center;
    padding: 0.9rem;
    border: 2px solid #dac8b8;
    border-radius: 16px;
    background: #fdf9f5;
    color: #5e4b3c;
    width: 100%;
    outline: none;
    transition: border-color 0.3s;
  }

  .pin-input:focus { border-color: #b26b5a; }

  .pin-error {
    color: #c0392b;
    font-size: 0.8rem;
    margin-top: 0.6rem;
    min-height: 1.2rem;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .pin-error.show { opacity: 1; }

  .btn-pin {
    margin-top: 1.2rem;
    font-family: 'Quicksand', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 0.85rem 2rem;
    border: none;
    background: #b26b5a;
    color: #fffcf7;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 6px 16px rgba(178, 107, 90, 0.35);
    width: 100%;
  }

  .btn-pin:hover {
    background: #9a5849;
    transform: translateY(-2px);
    box-shadow: 0 10px 22px rgba(178, 107, 90, 0.45);
  }

  /* ====== ENVELOPE SCREEN ====== */
  #envelopeScreen {
    background: linear-gradient(145deg, #f6efe9 0%, #e8d9d0 100%);
    z-index: 40;
  }

  .envelope {
    position: relative;
    width: 320px;
    height: 220px;
    background: linear-gradient(145deg, #e8d2c2, #d4b9a5);
    border-radius: 8px;
    box-shadow: 0 25px 50px -15px rgba(70, 45, 30, 0.4),
                inset 0 1px 2px rgba(255, 255, 255, 0.5);
    cursor: pointer;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    animation: floatEnvelope 3s ease-in-out infinite;
  }

  .envelope:hover { transform: scale(1.06) rotate(-2deg); }

  .envelope::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 0; height: 0;
    border-left: 160px solid transparent;
    border-right: 160px solid transparent;
    border-top: 110px solid #dcc4b1;
    border-radius: 8px 8px 0 0;
    transition: transform 0.6s ease;
    transform-origin: top;
  }

  .envelope.opened::before { transform: rotateX(180deg); }

  .envelope::after {
    content: "💌";
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 3.5rem;
    z-index: 3;
  }

  .envelope-seal {
    position: absolute;
    bottom: 20px; left: 50%;
    transform: translateX(-50%);
    width: 44px; height: 44px;
    background: radial-gradient(circle at 35% 35%, #d4846e, #a85a45);
    border-radius: 50%;
    z-index: 4;
    box-shadow: 0 3px 8px rgba(120, 60, 40, 0.4),
                inset 0 1px 2px rgba(255, 255, 255, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 1.1rem;
  }

  @keyframes floatEnvelope {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  /* ====== LETTER SCREEN ====== */
  #letterScreen {
    background: transparent;
    z-index: 10;
    position: fixed;
    inset: 0;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 2rem 1rem;
    overflow-y: auto;
  }

  #letterScreen.hide { opacity: 0; visibility: hidden; }

  .letter-paper {
    background: #fffcf7;
    border-radius: 28px;
    padding: 3rem 2.8rem 2.6rem;
    max-width: 820px;
    width: 100%;
    box-shadow: 0 25px 50px -15px rgba(70, 45, 30, 0.28);
    border: 1px solid rgba(230, 210, 190, 0.55);
    position: relative;
    margin: auto;
  }

  .sticker {
    position: absolute;
    font-size: 2.8rem;
    z-index: 5;
    pointer-events: none;
    animation: stickerBob 3s ease-in-out infinite;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
  }

  .sticker-1 { top: -20px; left: -15px; animation-delay: 0s; }
  .sticker-2 { top: -20px; right: -15px; animation-delay: 0.5s; }
  .sticker-3 { bottom: -15px; left: -15px; animation-delay: 1s; }
  .sticker-4 { bottom: -15px; right: -15px; animation-delay: 1.5s; }

  @keyframes stickerBob {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-8px) rotate(5deg); }
  }

  /* ====== LETTER BODY — CORMORANT GARAMOND (malinaw at madaling basahin) ====== */
  .letter-content {
    font-family: 'Cormorant Garamond', 'Georgia', serif;
    font-size: 1.35rem;
    line-height: 1.85;
    color: #3f3229;
    letter-spacing: 0.2px;
    font-weight: 400;
    min-height: 400px;
  }

  .letter-content p {
    margin-bottom: 1.6rem;
    text-indent: 0;
  }

  .letter-content p:first-of-type::first-letter {
    font-family: 'Cormorant Garamond', serif;
    font-size: 4.2rem;
    font-weight: 600;
    color: #b26b5a;
    float: left;
    line-height: 0.85;
    margin: 0.2rem 0.6rem 0 0;
  }

  /* ====== SIGNATURE — Great Vibes pa rin ====== */
  .signature-final {
    text-align: right;
    font-family: 'Great Vibes', cursive;
    font-size: 2.4rem;
    color: #836b5b;
    margin-top: 2rem;
    padding-top: 1.2rem;
    border-top: 1px dashed #dac8b8;
    opacity: 0;
    animation: fadeIn 1.2s ease forwards;
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  /* ====== MUSIC CONTROLS ====== */
  .music-btn {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #b26b5a;
    color: #fffcf7;
    border: none;
    font-size: 1.4rem;
    cursor: pointer;
    z-index: 100;
    box-shadow: 0 6px 16px rgba(178, 107, 90, 0.45);
    transition: all 0.3s ease;
    display: none;
    align-items: center;
    justify-content: center;
  }

  .music-btn.show { display: flex; }

  .music-btn:hover {
    background: #9a5849;
    transform: scale(1.1);
  }

  .music-btn.playing {
    animation: musicPulse 1.5s ease-in-out infinite;
  }

  @keyframes musicPulse {
    0%, 100% { box-shadow: 0 6px 16px rgba(178, 107, 90, 0.45); }
    50% { box-shadow: 0 6px 24px rgba(178, 107, 90, 0.8); }
  }

  /* ====== RESPONSIVE ====== */
  @media (max-width: 640px) {
    .letter-paper { padding: 2.2rem 1.7rem 2rem; border-radius: 22px; }
    .letter-content { font-size: 1.2rem; line-height: 1.8; }
    .letter-content p:first-of-type::first-letter { font-size: 3.6rem; }
    .envelope { width: 260px; height: 180px; }
    .envelope::before { border-left-width: 130px; border-right-width: 130px; border-top-width: 90px; }
    .sticker { font-size: 2rem; }
    .pin-card { padding: 2.2rem 1.5rem; }
    .signature-final { font-size: 2rem; }
  }

  @media (max-width: 400px) {
    .letter-paper { padding: 1.8rem 1.1rem 1.6rem; }
    .letter-content { font-size: 1.1rem; line-height: 1.75; }
    .letter-content p:first-of-type::first-letter { font-size: 3rem; }
    .pin-title { font-size: 1.7rem; }
    .signature-final { font-size: 1.8rem; }
  }
</style>
</head>
<body>

<!-- ====== PIN SCREEN ====== -->
<div class="screen" id="pinScreen">
  <div class="pin-card">
    <div class="pin-icon">🔐</div>
    <div class="pin-title">Enter PIN</div>
    <input type="password" class="pin-input" id="pinInput" maxlength="6" inputmode="numeric" placeholder="••••••">
    <div class="pin-error" id="pinError">Mali ang PIN. Subukan ulit.</div>
    <button class="btn-pin" id="pinBtn">Unlock</button>
  </div>
</div>

<!-- ====== ENVELOPE SCREEN ====== -->
<div class="screen hide" id="envelopeScreen">
  <div class="envelope" id="envelope">
    <div class="envelope-seal">♥</div>
  </div>
</div>

<!-- ====== LETTER SCREEN ====== -->
<div class="screen hide" id="letterScreen">
  <div class="letter-paper">
    <span class="sticker sticker-1">🧸</span>
    <span class="sticker sticker-2">🐻</span>
    <span class="sticker sticker-3">💗</span>
    <span class="sticker sticker-4">🤍</span>

    <div class="letter-content" id="letterContent"></div>
  </div>
</div>

<!-- ====== MUSIC BUTTON ====== -->
<button class="music-btn" id="musicBtn" title="Play music">🎵</button>

<!-- Hidden audio -->
<audio id="bgMusic" loop preload="auto">
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
  // ====== ELEMENTS ======
  const pinScreen = document.getElementById('pinScreen');
  const pinInput = document.getElementById('pinInput');
  const pinError = document.getElementById('pinError');
  const pinBtn = document.getElementById('pinBtn');

  const envelopeScreen = document.getElementById('envelopeScreen');
  const envelope = document.getElementById('envelope');

  const letterScreen = document.getElementById('letterScreen');
  const letterContent = document.getElementById('letterContent');

  const musicBtn = document.getElementById('musicBtn');
  const bgMusic = document.getElementById('bgMusic');

  const CORRECT_PIN = "090908";

  // ====== LETTER TEXT ======
  const letterText = `Hindi sa pagiging madrama ah. Gusto ko lang magsabi ng side ko, kahit papaano mabawasan ang nararamdaman ko. Alam ko ayaw mo na nagdadrama ako, pero sana naman maintindihan mo. Sasabihin ko 'to kasi sa totoo lang, hindi ko na alam kung saan ako lalapit ngayon. Pakiramdam ko wala na akong kaibigan dahil nga sa nangyari ngayon, wala na akong makausap tungkol sa mga nararamdaman ko.

Simula nung mga nangyari, parang unti-unti akong nawalan ng mga taong nakakasama at nakakausap ko. Pati ikaw, 'di ko akalain na fe-feel ko na iiwan mo din ako unti-unti. Kaya nga sa paglalaro na lang ako dumadaan para kahit papaano malibang ako at hindi ko masyadong maisip yung mga problema ko.

Bakit ganito pa yung nangyari sa akin? Alam ko na ayaw mo na talaga na kausapin ako. Ako lang yung makulit na pansinin ka. Shempre, ikaw lang kaya kong lapitan. Kilala mo naman ako na 'di naman ako nakikipag-usap sa ibang lalaki. Alam ko may nagawa nga akong mali sa'yo, pero 'di naman siguro 'to rason para ganito rin iparamdam mo sa akin. Na katulad ng ginawa sa akin noon.

Alam ko kaya ginagawa mo sa akin 'to kasi ayaw mo nga ako nasasaktan sa ginagawa mo, pero bakit ganon? Kaya mo gawin sa iba, pero bakit sa akin 'di mo kayang gawin? Dahil ba matagal na kitang kilala? Dahil ba sa ugaling meron ako?

Ayoko lang kasi mawala ka pa, kasi ikaw lang talaga ang meron ako. Pati sa IG, ngayon ko lang nakita na inunfollow mo pala ako. Bakit? Bakit 'te? Ano dahilan? Gulong-gulo na utak ko, ang daming boses na bumubulong. Gusto ko lang mabalik yung dati. Sobrang bigat kung sakali na pati ikaw wala na din.

Sa totoo lang, pagod na rin akong intindihin lahat. Napapasok na sa utak ko na gusto ko na magpakamatay. Minsan hindi ko na rin maintindihan yung sarili ko. Parang habang tumatagal, unti-unti na akong napag-iiwanan habang yung mga tao sa paligid ko, nagpapatuloy sa buhay nila. Ako, nandito pa rin, pilit tinatanggap lahat ng nangyayari sa akin. Hindi ko naman alam kung bakit sunod-sunod.

Alam ko marami ka din pinagdadaanan na problema, 'di ko naman intensyon na dumagdag sa'yo ngayon. Minsan naiisip ko na baka karma ko na lang talaga lahat ng 'to kaya tinatanggap ko na lang, kahit masakit. Hindi naman sa big deal sa akin yung sa pag-unfollow mo sa IG. Shempre, sa akin, ang dami na agad papasok sa utak ko na "bakit?" Dahil ba sa nangyari sa atin? Ang daming bakit. Gusto ko lang na maging tapat at totoo ka. Kung alam ko lang lahat, 'di ako ganito.

Kaya siguro ganito ako sa'yo kasi I genuinely want you back in my life. Matagal na kitang hinihintay, and honestly, I can't wait na makasama ka ulit pagpunta mo dito. You have no idea how many times ko nang na-imagine kung ano yung magiging araw na nandito ka na. Like, us going around places, talking about random things, laughing over stupid jokes, and just enjoying each other's company.

Ang tagal na nating hindi nagkikita, and the thought na magkakaroon na ulit tayo ng chance to spend time together feels so unreal to me. Kahit one or two days lang, I'd still be happy kasi at least after all these years, magkakasama na ulit tayo.

I think that's why this means so much to me. I've been looking forward to this for so long, and there's so much I want to share with you na hindi ko na alam kung saan magsisimula. I just want things to feel right between us when you get here. Ayokong sayangin yung chance na finally, we'll get to see each other.

I know things might be different now, and maybe we're not exactly the same people we were before, but I still hope we can make new memories together. I don't expect everything to be perfect, I just want us to enjoy the little time we'll have and make it count. Kasi for me, it's not just about seeing you again, it's about finally getting the chance to be with someone I've been waiting for, for so long. And honestly, I don't think you understand how much that means to me.

And I'm sorry if this is too much for you to read. I know you don't like it when I get emotional like this, pero I hope you can understand na I'm just trying to let out what I've been keeping to myself for so long. I'm not saying all of this para maawa ka sa akin or para pilitin kang bumalik. I just want to be honest with you, kahit papaano, kasi I don't want to keep pretending na okay lang ako when I'm clearly not.

I'm sorry for the times na naging makulit ako or for the things I've done that might have hurt you. I know I have my own mistakes, and I'm not trying to make excuses for them. I just hope you can hear me out this time without thinking na nagdadrama lang ako. I'm not asking you to fix everything or give me the same treatment as before. I just want some honesty from you, kahit masakit pa yung truth. If things have changed for you, I'd rather hear it from you than keep overthinking everything. I still care about you, and I hope you know that everything I said came from a genuine place. I'm sorry if I haven't been able to handle everything the right way. I just needed you to know how I really feel, kasi ang hirap din palang sarilinin lahat.`;

  // ====== PIN LOGIC ======
  pinBtn.addEventListener('click', checkPin);
  pinInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') checkPin(); });

  function checkPin() {
    const val = pinInput.value.trim();
    if (val === CORRECT_PIN) {
      pinError.classList.remove('show');
      pinScreen.classList.add('hide');
      setTimeout(() => {
        envelopeScreen.classList.remove('hide');
      }, 500);
    } else {
      pinError.classList.add('show');
      pinInput.value = '';
      pinInput.focus();
    }
  }

  // ====== ENVELOPE OPEN ======
  envelope.addEventListener('click', () => {
    envelope.classList.add('opened');

    bgMusic.volume = 0.6;
    const playPromise = bgMusic.play();

    if (playPromise !== undefined) {
      playPromise.then(() => {
        musicBtn.classList.add('playing');
        musicBtn.textContent = '🎶';
      }).catch(() => {
        console.log('Autoplay blocked — pindutin ang music button.');
      });
    }

    setTimeout(() => {
      envelopeScreen.classList.add('hide');
      letterScreen.classList.remove('hide');
      musicBtn.classList.add('show');
      setTimeout(startTypewriter, 700);
    }, 600);
  });

  // ====== TYPEWRITER EFFECT (MABAGAL) ======
  function startTypewriter() {
    letterContent.innerHTML = '';
    const paragraphs = letterText.split('\n').filter(p => p.trim() !== '');
    let pIndex = 0;
    let charIndex = 0;
    let currentP = null;

    const TYPING_SPEED = 55;
    const PARAGRAPH_PAUSE = 900;

    function typeNext() {
      if (pIndex >= paragraphs.length) {
        const sig = document.createElement('div');
        sig.className = 'signature-final';
        sig.textContent = '— Abby';
        letterContent.appendChild(sig);
        return;
      }

      if (!currentP) {
        currentP = document.createElement('p');
        letterContent.appendChild(currentP);
      }

      if (charIndex < paragraphs[pIndex].length) {
        currentP.textContent += paragraphs[pIndex].charAt(charIndex);
        charIndex++;
        letterScreen.scrollTop = letterScreen.scrollHeight;

        const delay = paragraphs[pIndex].charAt(charIndex - 1) === ' ' ? TYPING_SPEED * 0.6 : TYPING_SPEED;
        setTimeout(typeNext, delay);
      } else {
        pIndex++;
        charIndex = 0;
        currentP = null;
        setTimeout(typeNext, PARAGRAPH_PAUSE);
      }
    }

    typeNext();
  }

  // ====== MUSIC TOGGLE ======
  let musicPlaying = false;

  musicBtn.addEventListener('click', () => {
    if (musicPlaying) {
      bgMusic.pause();
      musicBtn.textContent = '🎵';
      musicBtn.classList.remove('playing');
      musicPlaying = false;
    } else {
      bgMusic.play().then(() => {
        musicBtn.textContent = '🎶';
        musicBtn.classList.add('playing');
        musicPlaying = true;
      }).catch(() => {
        musicBtn.textContent = '🔇';
        setTimeout(() => { musicBtn.textContent = '🎵'; }, 1500);
      });
    }
  });

  bgMusic.addEventListener('play', () => { musicPlaying = true; });
  bgMusic.addEventListener('pause', () => { musicPlaying = false; });

  window.addEventListener('load', () => { pinInput.focus(); });
</script>
</body>
</html>
